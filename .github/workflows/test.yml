name: 'CI'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - run: npm install

    - name: Check the CLI rejects missing arguments
      run: |
        if node ./lib/cli.js; then
          echo "::error::cli.js exited 0 without arguments"
          exit 1
        fi

    - name: Test
      if: env.EMAIL != ''
      run: node ./lib/cli.js "$EMAIL" "$PASSWORD" ./test/fixtures/Unity_v2021.1.1f1.alf

    - name: Note skipped end-to-end test
      if: env.EMAIL == ''
      run: echo "::notice::No Unity credentials available to this run (e.g. Dependabot or fork PRs); end-to-end activation was skipped."
